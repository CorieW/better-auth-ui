name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Config git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version package from changesets
        run: pnpm version-packages

      - name: Commit version changes
        id: version_commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add package.json pnpm-lock.yaml .changeset
            if [ -f CHANGELOG.md ]; then
              git add CHANGELOG.md
            fi

            git commit -m "chore: version package"
            git push
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: pnpm build

      - name: Pack package
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts

      - name: Resolve release tag
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Extract changeset release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          if (!fs.existsSync("CHANGELOG.md")) {
            process.exit(0);
          }

          const version = process.env.VERSION.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const match = changelog.match(new RegExp(`^##\\s+${version}\\b[^\\n]*\\n([\\s\\S]*?)(?=^##\\s+|\\s*$)`, "m"));
          const notes = match?.[1]?.trim() ?? "";
          const changes = notes
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter((line) => line && !/^#{1,6}\s/.test(line))
            .map((line) => `- ${line.replace(/^[*-]\s+/, "")}`);

          if (changes.length > 0) {
            const repository = process.env.GITHUB_REPOSITORY ?? "CorieW/better-auth-ui";
            const serverUrl = process.env.GITHUB_SERVER_URL ?? "https://github.com";
            const tag = process.env.TAG;
            const releaseNotes = [
              "**Changelog:**",
              ...changes,
              "",
              `**Full Changelog**: ${serverUrl}/${repository}/commits/${tag}`,
              ""
            ].join("\n");

            fs.writeFileSync("release-notes.md", releaseNotes);
          }
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ steps.version_commit.outputs.sha }}
        run: |
          git fetch --force --tags origin

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG" "$TARGET_SHA"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.tgz --clobber
          elif [ -s release-notes.md ]; then
            gh release create "$TAG" artifacts/*.tgz \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" artifacts/*.tgz \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
