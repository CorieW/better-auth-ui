name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release notes from changesets
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
          CHANGESET_STATUS_PATH: ${{ runner.temp }}/changeset-status.json
        run: |
          pnpm exec changeset status --output "$CHANGESET_STATUS_PATH"

          node <<'NODE'
          const fs = require("node:fs");

          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const status = JSON.parse(fs.readFileSync(process.env.CHANGESET_STATUS_PATH, "utf8"));
          const release = status.releases.find((item) => item.name === packageJson.name) ?? status.releases[0];

          if (!release) {
            process.exit(0);
          }

          const releaseChangesets = new Set(release.changesets ?? []);
          const changesets = status.changesets.filter((changeset) => releaseChangesets.has(changeset.id));

          if (changesets.length === 0) {
            process.exit(0);
          }

          const typeLabels = {
            major: "Major Changes",
            minor: "Minor Changes",
            patch: "Patch Changes"
          };

          const typeOrder = ["major", "minor", "patch"];
          const grouped = new Map(typeOrder.map((type) => [type, []]));

          for (const changeset of changesets) {
            const releaseType = changeset.releases.find((item) => item.name === release.name)?.type ?? release.type;
            const entries = grouped.get(releaseType) ?? [];
            entries.push(changeset.summary.trim());
            grouped.set(releaseType, entries);
          }

          const formatBullet = (summary) => {
            const lines = summary
              .split(/\r?\n/)
              .map((line) => line.trimEnd());
            const firstLine = lines[0].replace(/^[*-]\s+/, "");
            const rest = lines.slice(1).map((line) => (line ? `  ${line}` : ""));

            return [`- ${firstLine}`, ...rest].join("\n");
          };

          const lines = ["**Changelog:**", ""];

          for (const type of typeOrder) {
            const entries = grouped.get(type) ?? [];

            if (entries.length === 0) {
              continue;
            }

            lines.push(`### ${typeLabels[type]}`, "");
            lines.push(...entries.map(formatBullet), "");
          }

          const repository = process.env.GITHUB_REPOSITORY;
          const serverUrl = process.env.GITHUB_SERVER_URL ?? "https://github.com";

          if (repository && release.oldVersion && release.newVersion) {
            lines.push(
              `**Full Changelog**: ${serverUrl}/${repository}/compare/v${release.oldVersion}...v${release.newVersion}`,
              ""
            );
          }

          fs.writeFileSync(process.env.RELEASE_NOTES_PATH, lines.join("\n"));
          NODE

      - name: Config git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version package from changesets
        run: pnpm version-packages

      - name: Commit version changes
        id: version_commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add package.json pnpm-lock.yaml .changeset
            if [ -f CHANGELOG.md ]; then
              git add CHANGELOG.md
            fi

            git commit -m "chore: version package"
            git push
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: pnpm build

      - name: Pack package
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts

      - name: Resolve release tag
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
          TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ steps.version_commit.outputs.sha }}
        run: |
          git fetch --force --tags origin

          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG" "$TARGET_SHA"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -s "$RELEASE_NOTES_PATH" ]; then
              gh release edit "$TAG" \
                --title "$TAG" \
                --notes-file "$RELEASE_NOTES_PATH"
            fi

            gh release upload "$TAG" artifacts/*.tgz --clobber
          elif [ -s "$RELEASE_NOTES_PATH" ]; then
            gh release create "$TAG" artifacts/*.tgz \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --notes-file "$RELEASE_NOTES_PATH"
          else
            gh release create "$TAG" artifacts/*.tgz \
              --target "$TARGET_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
